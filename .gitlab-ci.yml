---
include:
  - project: nci-gdc/gitlab-templates
    ref: master
    file:
      - templates/artifacts/python-library.yaml

variables:
  LANGUAGE_VERSION: python3.9

pre-commit:
  script:
    - python -m pip install tox>=4.5
    - tox -re pre-commit

tox:
  parallel:
    matrix:
      - BUILD_PY_VERSION:
          - python3.9
          - python3.10
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres
  variables:
    POSTGRES_DB: plaster
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_HOST_AUTH_METHOD: trust
    PG_HOST: postgres

rebuild_gdcdatamodel2:
  stage: .post
  extends: .job-with-ssh-keys
  image: ${BASE_CONTAINER_REGISTRY}/${LANGUAGE_VERSION}-builder:${BASE_CONTAINER_VERSION}
  script:
    - dnf install curl-minimal
    - pip install setuptools_scm versionista
    - echo $CI_TRIGGERED_BRANCH
    - export VERSION=$(python -m setuptools_scm)
    - echo $VERSION
    - >
      curl --fail --request POST
      --form token=$CI_JOB_TOKEN
      --form ref=${CI_TRIGGERED_BRANCH:=develop}
      --form variables[CI_TRIGGER_BRANCH]=${CI_TRIGGER_BRANCH:-$VERSION}
      --form variables[PIP_INDEX_URL]="https://nexus.osdc.io/repository/pypi-all/simple"
      "https://gitlab.datacommons.io/api/v4/projects/22/trigger/pipeline"
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_REF_NAME == "develop"'
    - when: manual
