---

include:
  - project: nci-gdc/gitlab-templates
    ref: 0.3.1
    file:
      - templates/global/full.yaml
      - templates/python/full.yaml
      - templates/common/python.yaml

tox:
  parallel:
    matrix:
      - BUILD_PY_VERSION:
          - python3.8
          - python3.9
          - python3.10
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres
  variables:
    POSTGRES_DB: plaster
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_HOST_AUTH_METHOD: trust
    PG_HOST: postgres
  script:
    - tox -r -e py


release:
  variables:
    RELEASE_PY_VERSION: python3.8
    GIT_DEPTH: 0
  after_script:
    - curl --fail --request POST --form token=$CI_JOB_TOKEN --form ref=develop "https://gitlab.datacommons.io/api/v4/projects/22/trigger/pipeline"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
    - when: manual
