---
stages:
  - .pre
  - test
  - build
  - .trigger_gdcdictionary

include:
  - project: nci-gdc/gitlab-templates
    ref: 0.3.1
    file:
      - templates/global/full.yaml
      - templates/python/full.yaml
      - templates/common/python.yaml

tox:
  parallel:
    matrix:
      - BUILD_PY_VERSION:
          - python3.8
          - python3.9
          - python3.10
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres
  variables:
    POSTGRES_DB: plaster
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_HOST_AUTH_METHOD: trust
    PG_HOST: postgres
  script:
    - tox -r -e py


release:
  variables:
    RELEASE_PY_VERSION: python3.8
    GIT_DEPTH: 0

rebuild_gdcdatamodel2:
  stage: .trigger_gdcdictionary
  script:
    - apk add --no-cache curl
    - >
      curl --fail --request POST
      --form token=$CI_JOB_TOKEN
      --form ref=develop
      --form variables[CI_TRIGGER_BRANCH]=$CI_COMMIT_REF_NAME
      "https://gitlab.datacommons.io/api/v4/projects/22/trigger/pipeline"
    - echo $$CI_COMMIT_REF_NAME
  rules:
    - if: '$CI_COMMIT_REF_NAME == "develop"'
    - when: manual
