---
include:
  - project: nci-gdc/gitlab-templates
    ref: feat/dev-2441-add-python-wheel-release
    file:
      - templates/global/full.yaml
      - templates/python/full.yaml
      - templates/common/python/tox.yaml
      - templates/common/python/release.yaml

tox:
  parallel:
    matrix:
      - BUILD_PY_VERSION:
          - python3.8
          - python3.9
          - python3.10
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres
  variables:
    POSTGRES_DB: plaster
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_HOST_AUTH_METHOD: trust
    PG_HOST: postgres
  script:
    - tox -r -e py


release:
  variables:
    RELEASE_PY_VERSION: python3.8

rebuild_gdcdatamodel2:
  stage: .post
  script:
    - apk add --no-cache curl
    - echo $CI_COMMIT_REF_NAME
    - echo $CI_TRIGGERED_BRANCH
    - >
      curl --fail --request POST
      --form token=$CI_JOB_TOKEN
      --form ref=${CI_TRIGGERED_BRANCH:=develop}
      --form variables[CI_TRIGGER_BRANCH]=$CI_COMMIT_REF_NAME
      "https://gitlab.datacommons.io/api/v4/projects/22/trigger/pipeline"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "develop"'
    - when: manual
