---
include:
  - project: nci-gdc/gitlab-templates
    ref: 0.6.2
    file:
      - templates/global/full.yaml
      - templates/python/full.yaml
      - templates/common/python.yaml

tox:
  parallel:
    matrix:
      - BUILD_PY_VERSION:
          - python3.8
          - python3.9
          - python3.10
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres
  variables:
    POSTGRES_DB: plaster
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_HOST_AUTH_METHOD: trust
    PG_HOST: postgres
  script:
    - tox -r -e py


release:
  before_script:
    # unshallow the git repo to resolve version with setuptools_scm.
    - git fetch --unshallow || true
    - |
      if [ ${CI_COMMIT_TAG+x} ]; then
        export TWINE_REPOSITORY_URL=https://nexus.osdc.io/repository/pypi-releases/
      fi
  variables:
    RELEASE_PY_VERSION: python3.8
  after_script:
    - pip install "setuptools_scm==8.0.4" "setuptools-git-versioning<2"
    - python -m setuptools_git_versioning | tee VERSION.txt
  artifacts:
    paths:
      - VERSION.txt
    expire_in: 1 week

rebuild_gdcdatamodel2:
  stage: .post
  script:
    - apk add --no-cache curl
    - echo $CI_TRIGGERED_BRANCH
    - export VERSION=$(cat VERSION.txt)
    - echo $VERSION
    - >
      curl --fail --request POST
      --form token=$CI_JOB_TOKEN
      --form ref=${CI_TRIGGERED_BRANCH:=develop}
      --form variables[CI_TRIGGER_BRANCH]=${CI_TRIGGER_BRANCH:-$VERSION}
      "https://gitlab.datacommons.io/api/v4/projects/22/trigger/pipeline"
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_REF_NAME == "develop"'
    - when: manual
