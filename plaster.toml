title = "Data Model code generator configuration"

[environment]

[logging]
level = "INFO"
log_file = "plaster.log"

[profiles]

[profiles.biodictionary]
url = "ssh://git@github.com/NCI-GDC/biodictionary.git"
path = "biodictionary/schemas"
version = "0.12.0"
overwrite = false
type = "remote"

[profiles.gdcdictionary]
url = "https://github.com/NCI-GDC/gdcdictionary.git"
path = "gdcdictionary/schemas"
version = "2.4.1"
overwrite = false
type = "remote"

[profiles.midrc_dictionary]
url = "https://github.com/uc-cdis/midrc_dictionary.git"     # need to skip _settings.yaml
path = "gdcdictionary/schemas"
version = "0.7.6"
overwrite = false
type = "remote"
