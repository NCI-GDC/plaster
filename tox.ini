[tox]
minversion = 3.4.0
envlist = py{39,38}
skip_missing_interpreters = true

[pytest]
minversion = 6.0
addopts = -rflv
markers =
    slow: slow running tests
testpaths =
    tests
norecursedirs =
    examples/*

[flake8]
ignore = E203, E266, E501, W503, F403, F401
max-line-length = 89
max-complexity = 18
exclude =
    .git
    .tox
    .pytest*
    htmlcov
    build
    dist
    *.pyc
    .eggs

[testenv]
passenv =
    PG_*
    PIP_*
setenv =
    NO_PROXY=localhost,postgres
    no_proxy=localhost,postgres
deps =
    .[dev]
commands =
    pwd
    ls -R .tox
    python -m pytest -lvv -s --cov=plaster --cov-report html --cov-report term tests
allowlist_externals =
    ls
    pwd

[testenv:lint]
skip_install = True
commands_pre =
deps =
    mypy
    pre-commit
whitelist_externals =
    bash

commands =
    pre-commit run --all-files --show-diff-on-failure {posargs: }
    bash mypy

[testenv:docs]
commands =
    sphinx-build docs/source docs/build -b html

[testenv:publish]
changedir =
passenv =
  TWINE_*
skip_install=true
deps =
    setuptools_scm
    build
    twine
install_command =
    python -m pip install {opts} {packages}
commands =
    python -m setuptools_scm
    python -m build
    python -m twine check dist/*
    python -m twine upload dist/*
commands_post=
