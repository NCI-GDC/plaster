[tox]
minversion = 4.5.0
envlist = py{39,38}
skip_missing_interpreters = true
isolated_build = true

[pytest]
minversion = 6.0
addopts = -rflv
markers =
    slow: slow running tests
testpaths =
    tests
norecursedirs =
    examples/*

[testenv]
passenv =
    PG_*
    PIP_*
setenv =
    NO_PROXY=localhost,postgres
    no_proxy=localhost,postgres
    PIP_INDEX_URL=https://nexus.osdc.io/repository/pypi-all/simple
deps =
    .[dev]
commands =
    python -m pytest --junitxml=report.xml --cov-report html --cov-report xml:coverage.xml {posargs}

[testenv:pre-commit]
skip_install = True
commands_pre =
deps =
    mypy
    pre-commit
allowlist_externals =
    bash
commands =
    pre-commit run --all-files --show-diff-on-failure {posargs: }
    bash mypy

[testenv:docs]
commands =
    sphinx-build docs/source docs/build -b html

[testenv:publish]
changedir =
passenv =
    TWINE_*
    CI_COMMIT_*
skip_install=true
deps =
    setuptools_scm==8.1.0
    versionista
    build
    twine
install_command =
    python -m pip install {opts} {packages}
commands =
    python -m versionista
    python -m build
    python -m twine check dist/*
    python -m twine upload dist/*
commands_post=
