[tox]
minversion = 3.4.0
envlist = py{39,38}
skip_missing_interpreters = true

[pytest]
minversion = 6.0
addopts = -rflv
testpaths =
    tests

[flake8]
ignore = E203, E266, E501, W503, F403, F401
max-line-length = 89
max-complexity = 18
exclude =
    .git
    .tox
    .pytest*
    htmlcov
    build
    dist
    *.pyc
    .eggs

[testenv]
usedevelop = true
deps =
    -rdev-requirements.txt
commands =
    python -m pytest --cov=plaster --maxfail=2 --cov-report html --cov-report term

[testenv:lint]
whitelist_externals =
    bash

commands =
    pre-commit run --all-files --show-diff-on-failure {posargs: }
    bash mypy

[testenv:docs]
commands =
    sphinx-build docs/source docs/build -b html
