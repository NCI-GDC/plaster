[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 98
include = '\.pyi?$'

[tool.coverage.html]
title = "plaster coverage report"
directory = "docs/htmlcov"
show_contexts = true

[tool.coverage.run]
branch = true
context = "unit tests"
source = ["plaster"]

[tool.isort]
profile = "black"
known_first_party = ["plaster"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true

[tool.mypy-dulwich]
ignore_missing_imports = true

[tool.mypy-jsonschema]
ignore_missing_imports = true

[tool.setuptools_scm]
local_scheme = "no-local-version"
version_scheme = "versioning:get_version"
