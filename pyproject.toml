[build-system]
requires = ["setuptools>=66", "wheel", "setuptools_scm[toml]==8.1.0", "versionista>=1.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdc-plaster"
dynamic = [
  "version",
  "description",
  "readme",
  "requires-python",
  "license",
  "authors",
  "maintainers",
  "keywords",
  "classifiers",
  "urls",
  "scripts",
  "gui-scripts",
  "entry-points",
  "dependencies",
  "optional-dependencies"
]

[tool.coverage.html]
title = "plaster coverage report"
directory = "docs/htmlcov"
show_contexts = true

[tool.coverage.run]
branch = true
context = "unit tests"
source = ["plaster"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true

[tool.mypy-dulwich]
ignore_missing_imports = true

[tool.mypy-jsonschema]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = 6.2
python_files = "test_*.py"
python_functions = "test_*"
junit_family = "xunit2"
junit_logging = "system-out"
console_output_style = "classic"
log_cli_level = "INFO"
log_cli = "true"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-rfE --color=yes --cov=plaster --cov-report term"
norecursedirs = [
  ".git",
  ".tox",
  "dist",
  "build"
]
testpaths = [
  "tests/unit",
  "tests/integration"
]

[tool.ruff]
line-length = 95
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
ignore = ["E501"]
select = [
  "E", # pydocstyle errors
  "F", # pyflakes
  "I", # isort
  "N", # pep8 naming
  "RUF", # ruff specific rules
  "UP", # pyupgrade
  "W" # pydocstyle warnings
]

[tool.ruff.lint.isort]
known-first-party = ["plaster", "tests"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.setuptools_scm]
local_scheme = "versionista-local-format"
version_scheme = "versionista-format"
