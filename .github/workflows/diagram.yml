---
name: Create diagram
on:
  workflow_dispatch: {}
  push:
    branches:
      - master
      - develop
      - feat/dev-1160-add-datetime-hooks-for-nodes
jobs:
  get_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@master
      - name: Update diagram
        uses: githubocto/repo-visualizer@main
        with:
          output_file: "images/diagram.svg"
          excluded_paths: "ignore,.github"
