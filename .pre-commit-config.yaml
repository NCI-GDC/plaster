---
exclude: .svg$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: ^\.gitlab-ci.yml
      - id: end-of-file-fixer
        exclude: ^images/
      - id: fix-encoding-pragma
        args: [--remove]
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, master, --pattern, release/.*]
      - id: pretty-format-json
        args: [--autofix]
      - id: trailing-whitespace
        exclude_types: [yaml]    # conflict with yaml format
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf
      - id: remove-crlf
      - id: forbid-tabs
        exclude: .(py|yaml|yml|tsv)$
      - id: remove-tabs
        exclude: .(py|yaml|yml|tsv)$
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args: [--skip, 'B101,B106,B303,B324,B404,B405,B607,B603', --exclude, 
              tests, --exclude, examples/tests]
  - repo: https://github.com/qiaouchicago/markdown-toc
    rev: 0.1.0
    hooks:
      - id: markdown-toc
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
        name: mdformat
        entry: mdformat
        types: [markdown]
        args: [--wrap, '88']
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.1.1
    hooks:
      - id: pydocstyle
        args: [convention=google, --add-ignore, 'D100,D101,D102,D103,D104,D105,D106,D107']
        exclude: ^(tests|unit_tests)/
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.18.0
    hooks:
      - id: toml-sort
        args: [--in-place]
  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.1
    hooks:
      - id: yamlfmt
        args: [--mapping, "2", --sequence, "4", --offset, "2", --width, "80", "--preserve-quotes"]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
