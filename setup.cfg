[metadata]
name = gdc-plaster
description = GDC data model generator.
long_description = file: README.md
long_description_content_type = text/markdown
author = GDC Feature Team
author_email = gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com
maintainer = GDC Feature Team
maintainer_email = gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com
license = Apache Software License 2.0
license_files = LICENSE
url = https://github.com/NCI-GDC/plaster
keywords = GDC Data Commons, Data Model, gdcdictionary, plaster
classifiers =
    Intended Audience :: Developers
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Development Status :: 5 - Production/Stable
    License :: OSI Approved :: Apache Software License

[options]
zip_safe = True
packages = find:
package_dir =
    =src
python_requires = >=3.9
include_package_data = True

install_requires =
   click~=8.0
   dulwich
   Jinja2~=3.0
   jsonschema
   pyyaml>=6.0.1
   toml~=0.10
   psqlgml>=0.2.4
   psqlgraph==6.0.3

[options.packages.find]
where = src

[options.extras_require]
dev =
    coverage[toml]
    deepdiff>=5.8.1
    pyhamcrest
    pytest>=6.2
    pytest-cov
docs =
    sphinx
    sphinx_rtd_theme
    sphinxcontrib-httpdomain
examples =
    pytest>=6.2
    pytest-psqlgraph>=0.1.1

[options.entry_points]
console_scripts =
    plaster = plaster.cli:app
