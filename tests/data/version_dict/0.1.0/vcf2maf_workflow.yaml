---
$schema: "http://json-schema.org/draft-04/schema#"

id: "vcf2maf_workflow"
title: vcf2maf Workflow
type: object
category: analysis
namespace: https://gdc.cancer.gov/
program: '*'
project: '*'
description: >
  Metadata for workflow used to convert a VCF to MAF.
additionalProperties: false
submittable: true
validators:

systemProperties:
  - id
  - project_id
  - created_datetime
  - updated_datetime

tagProperties:
  - workflow_type

tagBuilderConfig:
  ignoreEntries:
    - prop: workflow_type
      values:
        - SomaticSniper

links: []

required:
  - submitter_id
  - workflow_link
  - workflow_type

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

properties:
  workflow_type:
    enum:
      - CaVEMan
      - MuTect2
      - MuSE
      - VarScan2
      - SomaticSniper
      - Pindel
      - Sanger Pindel
