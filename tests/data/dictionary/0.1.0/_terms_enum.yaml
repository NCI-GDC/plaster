rhabdomyosarcoma:
  common:
    description: >-
      A rare aggressive malignant mesenchymal neoplasm arising from skeletal muscle.
      It usually occurs in children and young adults. Only a small percentage of tumors
      arise in the skeletal muscle of the extremities. The majority arise in other
      anatomical sites.
    termDef:
      term: >-
        Rhabdomyosarcoma
