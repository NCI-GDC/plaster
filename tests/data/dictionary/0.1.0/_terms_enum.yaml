ewing_sarcoma:
  common:
    description: >-
      A small round cell tumor that lacks morphologic, immunohistochemical, and electron
      microscopic evidence of neuroectodermal differentiation. It represents one of
      the two ends of the spectrum called Ewing sarcoma/peripheral neuroectodermal
      tumor. It affects mostly males under age 20, and it can occur in soft tissue
      or bone. Pain and the presence of a mass are the most common clinical symptoms.
    termDef:
      term: >-
        Ewing Sarcoma
      source: NCIt
      cde_id:
      cde_version:
      term_url: "https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&ns=ncit&code=C4817"
      term_id: C4817
      term_version: 20.05a

