      - Non cancerous tissue
      - Osteosarcoma (OS)
      - Rhabdoid tumor (kidney) (RT)
      - Rhabdomyosarcoma
      - Soft tissue sarcoma, non-rhabdomyosarcoma
      - Wilms tumor (WT)
    enumDef:
      Ewing sarcoma:
        $ref:
          - "_terms_enum.yaml#/ewing_sarcoma/common"
      Rhabdomyosarcoma:
        $ref:
          - "_terms_enum.yaml#/rhabdomyosarcoma/common"

  tumor_code_id:
