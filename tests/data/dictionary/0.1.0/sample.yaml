      - "62"
      - "63"
      - "64"
      - "65"
      - "70"
      - "71"
      - "80"
      - "81"

  tumor_descriptor:
    $ref:
      - "_terms.yaml#/tumor_descriptor/common"
    enum:
      - Metastatic
      - NOS
      - Not Allowed To Collect
      - Not Applicable
      - Premalignant
      - Primary
      - Recurrence
      - Xenograft
      - Unknown
      - Not Reported
    deprecated_enum:
